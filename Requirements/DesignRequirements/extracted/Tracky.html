<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracky — Mobile Prototype</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
@font-face { font-family:'Inter'; font-weight:400; src:url('./fonts/inter_regular.ttf') format('truetype'); }
@font-face { font-family:'Inter'; font-weight:500; src:url('./fonts/inter_medium.ttf') format('truetype'); }
@font-face { font-family:'Inter'; font-weight:600; src:url('./fonts/inter_semibold.ttf') format('truetype'); }
@font-face { font-family:'RobotoMono'; font-weight:400 700; src:url('./fonts/roboto_mono_variable.ttf') format('truetype'); }
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; }
body { font-family:'Inter', system-ui, sans-serif; background:#0C0D12; }
#root { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:4px; }

@keyframes sessionPulse {
  0%, 100% { background: var(--pulse-bg-from); }
  50%       { background: var(--pulse-bg-to); }
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
</style>
<script src="tracky-tokens.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tracky-icons.jsx"></script>
<script type="text/babel" src="tracky-primitives.jsx"></script>
<script type="text/babel" src="tracky-auth.jsx"></script>
<script type="text/babel" src="tracky-main.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { LIGHT, DARK } = window.TRACKY_TOKENS;

const SCREENS = [
  { key: 'login',      label: 'Login' },
  { key: 'register',   label: 'Register' },
  { key: 'emailSent',  label: 'Email Verification' },
  { key: 'forgot',     label: 'Forgot Password' },
  { key: 'overview',   label: 'Project Overview' },
  { key: 'detail',     label: 'Project Detail' },
];

/* ── Single Phone Instance ───────────────────────────────── */
function TrackyApp({ isDark, screen, setScreen, variation, userName }) {
  const c = isDark ? DARK : LIGHT;
  const [project, setProject] = useState(null);

  const navigate = (s, proj) => {
    setScreen(s);
    if (proj) setProject(proj);
  };

  const pulseBgFrom = isDark ? `${c.primaryContainer}44` : `${c.primaryContainer}55`;
  const pulseBgTo   = isDark ? `${c.primaryContainer}88` : `${c.primaryContainer}99`;

  const screenMap = {
    login:     <LoginScreen c={c} navigate={navigate} />,
    register:  <RegisterScreen c={c} navigate={navigate} />,
    emailSent: <EmailSentScreen c={c} navigate={navigate} />,
    forgot:    <ForgotPasswordScreen c={c} navigate={navigate} />,
    overview:  <OverviewScreen c={c} navigate={navigate} userName={userName} variation={variation} />,
    detail:    <DetailScreen c={c} navigate={navigate} project={project} />,
  };

  return (
    <PhoneFrame c={c} isDark={isDark}>
      <style>{`
        [data-theme] { --pulse-bg-from: ${pulseBgFrom}; --pulse-bg-to: ${pulseBgTo}; }
      `}</style>
      <div data-theme={isDark ? 'dark' : 'light'} style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', '--pulse-bg-from': pulseBgFrom, '--pulse-bg-to': pulseBgTo }}>
        {screenMap[screen] || screenMap['login']}
      </div>
    </PhoneFrame>
  );
}

/* ── Tweaks Panel ────────────────────────────────────────── */
function TweaksPanel({ show, onClose, screen, setScreen, variation, setVariation, userName, setUserName }) {
  if (!show) return null;
  const panelBg = '#1A1B22';
  const border = '#2E2F38';
  const fg = '#E2E2E9';
  const fgMuted = '#8F9099';
  const accent = '#B0C6FF';

  return (
    <div style={{
      position: 'fixed', bottom: 24, right: 24, zIndex: 9999, width: 240,
      background: panelBg, borderRadius: 18, padding: '16px 18px 20px',
      boxShadow: '0 16px 48px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06)',
      fontFamily: 'Inter, sans-serif', animation: 'fadeIn 0.2s ease',
      maxHeight: '80vh', overflowY: 'auto',
    }}>
      {/* Header */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom: 16 }}>
        <span style={{ fontSize: 13, fontWeight: 700, color: fg, letterSpacing: '0.02em' }}>Tweaks</span>
        <button onClick={onClose} style={{ background:'none', border:'none', cursor:'pointer', color: fgMuted, fontSize: 16, padding: 2, display:'flex' }}>
          <Icon name="x" size={16} color={fgMuted} />
        </button>
      </div>

      {/* Screen */}
      <div style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: '0.08em', color: fgMuted, textTransform: 'uppercase', marginBottom: 8 }}>Screen</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
          {SCREENS.map(s => (
            <button key={s.key} onClick={() => setScreen(s.key)} style={{
              display: 'block', width: '100%', textAlign: 'left', padding: '7px 10px',
              background: screen === s.key ? '#2F4578' : 'transparent',
              border: 'none', borderRadius: 8, cursor: 'pointer',
              fontSize: 13, color: screen === s.key ? '#D9E2FF' : fg,
              fontWeight: screen === s.key ? 600 : 400, fontFamily: 'Inter, sans-serif',
              transition: 'background 0.12s',
            }}>{s.label}</button>
          ))}
        </div>
      </div>

      <div style={{ height: 1, background: border, margin: '0 0 16px' }} />

      {/* Variation */}
      <div style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: '0.08em', color: fgMuted, textTransform: 'uppercase', marginBottom: 8 }}>Overview variation</div>
        <div style={{ display: 'flex', gap: 6 }}>
          {['A', 'B'].map(v => (
            <button key={v} onClick={() => setVariation(v)} style={{
              flex: 1, padding: '7px 0', borderRadius: 8, border: `1px solid ${variation === v ? accent : border}`,
              background: variation === v ? '#2F4578' : 'transparent',
              color: variation === v ? accent : fgMuted, fontSize: 13, fontWeight: 600,
              fontFamily: 'Inter, sans-serif', cursor: 'pointer',
            }}>
              {v === 'A' ? 'Default' : 'Colored'}
            </button>
          ))}
        </div>
        <div style={{ fontSize: 11, color: fgMuted, marginTop: 6, lineHeight: 1.4 }}>
          {variation === 'A' ? 'Clean white top bar' : 'Primary-container colored bar'}
        </div>
      </div>

      <div style={{ height: 1, background: border, margin: '0 0 16px' }} />

      {/* Username */}
      <div>
        <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: '0.08em', color: fgMuted, textTransform: 'uppercase', marginBottom: 8 }}>Display name</div>
        <input
          value={userName}
          onChange={e => setUserName(e.target.value)}
          placeholder="Alex Johnson"
          style={{
            width: '100%', background: '#0C0D12', border: `1px solid ${border}`, borderRadius: 8,
            padding: '7px 10px', fontSize: 13, color: fg, fontFamily: 'Inter, sans-serif', outline: 'none',
          }}
        />
        <div style={{ fontSize: 11, color: fgMuted, marginTop: 4 }}>Sets the initials avatar</div>
      </div>
    </div>
  );
}

/* ── Root App ────────────────────────────────────────────── */
function App() {
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "variation": "A",
    "userName": "Alex Johnson",
    "startScreen": "register"
  }/*EDITMODE-END*/;

  const [screen, setScreen] = useState(TWEAK_DEFAULTS.startScreen);
  const [variation, setVariation] = useState(TWEAK_DEFAULTS.variation);
  const [userName, setUserName] = useState(TWEAK_DEFAULTS.userName);
  const [showTweaks, setShowTweaks] = useState(false);

  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode')   setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const handleSetTweaks = (key, val) => {
    if (key === 'variation')   setVariation(val);
    if (key === 'userName')    setUserName(val);
    if (key === 'startScreen') setScreen(val);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  };

  return (
    <>
      {/* Canvas */}
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        gap: 40, padding: '24px 40px', width: '100%', height: '100%',
        overflowX: 'auto', overflowY: 'hidden',
      }}>
        {/* Labels */}
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>
          <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.1em', color: '#555670', textTransform: 'uppercase', fontFamily: 'Inter, sans-serif' }}>Light</div>
          <TrackyApp isDark={false} screen={screen} setScreen={setScreen} variation={variation} userName={userName} />
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>
          <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.1em', color: '#555670', textTransform: 'uppercase', fontFamily: 'Inter, sans-serif' }}>Dark</div>
          <TrackyApp isDark={true} screen={screen} setScreen={setScreen} variation={variation} userName={userName} />
        </div>
      </div>

      <TweaksPanel
        show={showTweaks}
        onClose={() => { setShowTweaks(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); }}
        screen={screen}
        setScreen={(s) => { setScreen(s); handleSetTweaks('startScreen', s); }}
        variation={variation}
        setVariation={(v) => handleSetTweaks('variation', v)}
        userName={userName}
        setUserName={(u) => handleSetTweaks('userName', u)}
      />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
