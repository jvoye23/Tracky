androidx-espresso = "3.7.0"
androidx-lifecycle = "2.11.0"
androidx-testExt = "1.3.0"
androidx-test = "1.7.0"
# Matches the androidx.compose.ui the app resolves through Compose Multiplatform: the test APK
# must not pull a different Compose than the app it instruments.
androidx-compose-ui-test = "1.12.1"
composeMultiplatform = "1.12.1"
junit = "4.13.2"
kotlin = "2.4.20"
material3 = "1.4.0"
kotlinx-coroutines = "1.11.0"
coilCompose = "3.6.3"
koin = "4.2.2"
kermit = "2.2.0"
datastore = "1.2.1"
ksp = "2.3.11"
kotlinxDatetime = "0.8.0"
kotlinxSerializationJson = "1.11.0"
material3Version = "1.9.0"
navigationCompose = "2.9.2"
navigationEvent = "1.1.1"
materialIconsExtended = "1.7.3"
coreSplashscreen = "1.2.0"
room = "2.8.5"
uiToolingPreview = "1.12.1"
uuid = "0.8.4"
sqlite = "2.7.1"
adaptive = "1.2.0"
work = "2.12.0"
lifecycleProcess = "2.11.0"
turbine = "1.2.1"
# Desktop PDF export only - Android and iOS write PDFs with platform APIs.
pdfbox = "3.0.8"
# Android + iOS only - there is no jvm artifact, so these stay out of commonMain.
mokoPermissions = "0.20.1"

# For Compose Multiplatform
cmpNavigation3 = "1.1.1"

# PRISM (verification tooling)
assertk = "0.28.1"
composeRules = "0.6.4"
coroutines = "1.10.2"
detekt = "2.0.0-alpha.6"
jacoco = "0.8.15"
# The PRISM tooling modules build on a Java 11 toolchain, and JUnit 6 needs 17: they stay on the
# last JUnit 5 line. The app's JVM tests run on JUnit 6.
junit5 = "5.14.4"
junit6 = "6.1.3"
konsist = "0.17.3"
ktlint = "1.8.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
